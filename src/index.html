<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>TrailBook</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/trailbook-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#164e63">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TrailBook">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/theme.css">

</head>

<body>

    <div id="app"></div>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="trailbook.build.js"></script>
    <script src="trailbook.local-config.js" onerror="this.remove()"></script>
    <script>
        if (["localhost", "127.0.0.1", "[::1]"].includes(location.hostname)) {
            const developmentBuildInfo = document.createElement("footer");
            developmentBuildInfo.id = "trailbook-development-build-info";
            developmentBuildInfo.className =
                "trailbook-build-info trailbook-development-build-info";
            developmentBuildInfo.dataset.compact = "true";
            developmentBuildInfo.textContent =
                "TrailBook · local · dev-checking... · SW: disabled";
            document.body.append(developmentBuildInfo);
            import(`./js/ui/BuildInfoView.js?diagnostics=${Date.now()}`)
                .then(async module => {
                    const fingerprintPromise =
                        module.getDevelopmentBuildIdentifier();

                    window.TRAILBOOK_DEVELOPMENT_FINGERPRINT =
                        fingerprintPromise;
                    const developmentBuildIdentifier =
                        await fingerprintPromise;

                    window.TRAILBOOK_DEVELOPMENT_FINGERPRINT =
                        developmentBuildIdentifier;
                    await module.resolveBuildInfoElements(
                        [developmentBuildInfo],
                        {
                            developmentBuildIdentifier,
                            serviceWorkerRegistration: null
                        }
                    );
                    document.querySelectorAll(".trailbook-build-info")
                        .forEach(element => module.updateBuildInfoElement(
                            element,
                            {
                                developmentBuildIdentifier,
                                serviceWorkerStatus: "disabled"
                            }
                        ));
                })
                .catch(() => {
                    developmentBuildInfo.textContent =
                        "TrailBook · local · dev-unavailable · SW: disabled";
                });
        }
    </script>
    <script type="module" src="js/main.js"></script>

</body>

</html>
